<svg xmlns="http://www.w3.org/2000/svg" width="820" height="210" viewBox="0 0 820 210" role="img" aria-label="Webcam to MediaPipe to gesture recognition to interaction controls to the Three.js Earth model, with scientific content also feeding the model">
